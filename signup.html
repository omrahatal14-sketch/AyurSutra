<!DOCTYPE html>
<html>
<head>
  <title>Signup</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Raleway', sans-serif;
      background: linear-gradient(135deg, #15803D 0%, #14532D 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #1f2937;
    }

    .logo {
      width: 80px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .box {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 40px;
      border-radius: 24px;
      width: 320px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.5);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      margin-top: 0;
      margin-bottom: 25px;
      font-family: 'Lora', serif;
      font-weight: 700;
      color: #14532D;
    }

    input, select {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      background: rgba(255, 255, 255, 0.8);
      font-family: 'Raleway', sans-serif;
      font-size: 15px;
      transition: all 0.3s ease;
      box-sizing: border-box;
      appearance: none;
    }

    select {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
      padding-right: 40px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #15803D;
      box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.2);
      background-color: #ffffff;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      background: linear-gradient(135deg, #15803D, #166534);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: 'Raleway', sans-serif;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(21, 128, 61, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(21, 128, 61, 0.4);
    }

    p {
      margin-top: 25px;
      font-size: 14px;
      color: #4b5563;
      line-height: 1.6;
    }

    a {
      color: #15803D;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    a:hover {
      color: #166534;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="box">
   <img src="Image/logo.png" class="logo">
  <h2>AyurSutra Signup</h2>

  <form id="signupForm">
    <input type="text" id="name" placeholder="Enter your name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>

    <select id="role" required>
      <option value="">Select Role</option>
      <option value="doctor">Doctor</option>
      <option value="patient">Patient</option>
    </select>

    <div id="doctorFields" style="display:none; transition: all 0.3s ease;">
      <input type="text" id="license" placeholder="Ayurvedic Medical License No. (If Doctor)">
      
      <label style="font-size:12px; margin-top:10px; display:block; text-align:left; color:#4b5563; font-weight:600;">Degree Certificate (PDF/JPG/PNG)</label>
      <input type="file" id="degreeFile" accept=".pdf,.jpg,.jpeg,.png" style="background:transparent; border:none; padding:8px 0;">
      
      <label style="font-size:12px; margin-top:5px; display:block; text-align:left; color:#4b5563; font-weight:600;">Valid ID Proof (PDF/JPG/PNG)</label>
      <input type="file" id="idProofFile" accept=".pdf,.jpg,.jpeg,.png" style="background:transparent; border:none; padding:8px 0;">
    </div>

    <button type="submit">Signup</button>
  </form>

  <script>
    document.getElementById('role').addEventListener('change', function(e) {
      const docFields = document.getElementById('doctorFields');
      const licenseInput = document.getElementById('license');
      const degreeFile = document.getElementById('degreeFile');
      const idProofFile = document.getElementById('idProofFile');

      if (e.target.value === 'doctor') {
        docFields.style.display = 'block';
        licenseInput.required = true;
      } else {
        docFields.style.display = 'none';
        licenseInput.required = false;
        licenseInput.value = '';
        degreeFile.value = '';
        idProofFile.value = '';
      }
    });
  </script>

  <p>Already have an account?<br>
    <a href="login.html">Login</a>
  </p>
</div>

<script type="module" src="js/auth.js"></script>
</body>
</html>
